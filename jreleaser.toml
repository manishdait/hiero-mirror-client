# https://jreleaser.org/guide/latest/reference

[signing.pgp]
active = "ALWAYS"
armored = true

[deploy.maven.mavenCentral.release-deploy]
active = "RELEASE"
url = "https://central.sonatype.com/api/v1/publisher"
stagingRepositories = ["target/staging-deploy"]
applyMavenCentralRules = true
skipPublicationCheck = true

retryDelay = 20
maxRetries = 400

[release.github]
owner = "manishdait"
name = "hiero-mirror-client"
skipTag = true
skipRelease = false
overwrite = true

[release.github.update]
enabled = true
sections = ["ASSETS", "BODY"]

[release.github.changelog]
enabled = true
formatted = "ALWAYS"
